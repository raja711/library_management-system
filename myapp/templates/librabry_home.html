<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Catalog Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #333;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar h2 {
            margin: 0;
            font-size: 22px;
            color: #5cb85c;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #5cb85c;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
        }
        .hero h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }
        .hero p {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 950px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            width: 180px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        .card p {
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .card a {
            display: inline-block;
            background-color: #5cb85c;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .card a:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>Library MS</h2>
        <div class="nav-links">
            <a href="{% url 'library_home' %}">Home</a>
            <a href="{% url 'book_list' %}">Book List</a>
            <a href="{% url 'signup' %}">Signup</a>
        </div>
    </div>

    <div class="hero">
        <h1>Welcome to the Library Catalog</h1>
        <p>Manage your books, records, and user accounts efficiently from one dashboard.</p>

        <div class="card-container">
            <div class="card">
                <h3>Add Book</h3>
                <p>Insert new books.</p>
                <a href="{% url 'add_book' %}">Add New</a>
            </div>
            <div class="card">
                <h3>Book List</h3>
                <p>View all books.</p>
                <a href="{% url 'book_list' %}">View List</a>
            </div>
            <div class="card">
                <h3>Update Book</h3>
                <p>Modify records.</p>
                <a href="{% url 'update_book' %}">Update</a>
            </div>
            <div class="card">
                <h3>Account</h3>
                <p>Register user.</p>
                <a href="{% url 'signup' %}">Signup</a>
            </div>
        </div>
    </div>

</body>
</html>
