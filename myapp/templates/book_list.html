<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; }
        ul { max-width: 600px; margin: auto; padding: 0; list-style: none; }
        li { background: #f9f9f9; margin-bottom: 10px; padding: 15px; border: 1px solid #ddd; }
        a { color: #5cb85c; text-decoration: none; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="{% url 'library_home' %}">Home</a> | <a href="{% url 'add_book' %}">Add New Book</a>
    </div>
    <h2 style="text-align: center;">Available Books</h2>
    <ul>
        {% for book in books %}
            <li>
                <strong>ID:</strong> {{ book.id }}<br>
                <strong>Title:</strong> <a href="{% url 'book_detail' book.id %}">{{ book.title }}</a><br>
                <strong>Author:</strong> {{ book.author }}
            </li>
        {% empty %}
            <p style="text-align: center;">No books available in the catalog.</p>
        {% endfor %}
    </ul>
</body>
</html>
