<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Detail</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; text-align: center; }
        .card { max-width: 400px; margin: auto; background: #f9f9f9; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ book.title }}</h2>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>Description:</strong> {{ book.description|default:"No description provided." }}</p>
        <br>
        <a href="{% url 'book_list' %}">Back to Book List</a>
    </div>
</body>
</html>
